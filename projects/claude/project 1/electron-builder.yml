appId: com.quickimage.app
productName: QuickImage
copyright: Copyright © 2026 QuickImage

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - resources/**/*
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.prettierrc}'

asarUnpack:
  - resources/**

# The overlay is summoned with a global hotkey, so the app intentionally has no
# dock presence and starts hidden in the tray/menu bar.
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  darkModeSupport: true
  extendInfo:
    LSUIElement: 1
    NSHighResolutionCapable: true
  # Unsigned local builds: without this, Gatekeeper quarantines the .dmg output.
  identity: null
  notarize: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  title: ${productName} ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]

nsis:
  artifactName: ${productName}-${version}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: QuickImage

msi:
  artifactName: ${productName}-${version}.${ext}
  oneClick: false
  perMachine: false

linux:
  icon: build/icon.png
  category: Graphics
  target:
    - AppImage
